name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python3 -m pip install ruff==0.17.4

      - name: Lint
        run: ruff check .

      - name: Compile
        run: python3 -m py_compile make_demo.py test_make_demo.py

      - name: Test
        run: python3 -m unittest -v

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the trailers
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          failed=0
          for sha in $(git rev-list "$base"..HEAD); do
            body=$(git log -1 --format=%B "$sha")
            printf '%s\n' "$body" | grep -q '^Co-authored-by: .\+ <.\+@.\+>$' ||
              { echo "$sha: missing Co-authored-by" >&2; failed=1; }
            printf '%s\n' "$body" | grep -q '^Signed-off-by: .\+ <.\+@.\+>$' ||
              { echo "$sha: missing Signed-off-by" >&2; failed=1; }
          done
          exit "$failed"
