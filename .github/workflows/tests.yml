name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the shell tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats gettext shellcheck

      - name: Build the catalogues
        run: tools/build-locales.sh

      - name: Install the project
        run: python3 -m pip install -e ".[dev]"

      - name: Shellcheck
        run: shellcheck tools/build-locales.sh .githooks/commit-msg

      - name: Test the shell scripts
        run: bats tests/shell

      - name: Lint
        run: ruff check .

      - name: Check the formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy src/terminal_svg_demo

      - name: Test with coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report

      - name: Rebuild the examples
        run: |
          terminal-svg-demo examples/euromillions.json examples/euromillions.svg
          terminal-svg-demo examples/self-demo.json examples/self-demo.svg
          git diff --exit-code

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Build the catalogues
        run: tools/build-locales.sh

      - name: Install the project
        run: python3 -m pip install -e .

      - name: Test
        run: python3 -m unittest discover -s tests -v

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch the base branch
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check the trailers
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          failed=0
          for sha in $(git rev-list "$base"..HEAD); do
            body=$(git log -1 --format=%B "$sha")
            printf '%s\n' "$body" | grep -q '^Co-authored-by: .\+ <.\+@.\+>$' ||
              { echo "$sha: missing Co-authored-by" >&2; failed=1; }
            printf '%s\n' "$body" | grep -q '^Signed-off-by: .\+ <.\+@.\+>$' ||
              { echo "$sha: missing Signed-off-by" >&2; failed=1; }
          done
          exit "$failed"

  package-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats build-essential debhelper dh-python dh-sequence-python3 \
            gettext git pybuild-plugin-pyproject python3-all python3-setuptools shellcheck

      - name: Build the Debian package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          cp ../terminal-svg-demo_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  package-rpm:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream10
    steps:
      - name: Install the packaging tools
        run: |
          dnf config-manager --set-enabled crb
          dnf install -y -q git tar gzip rpm-build gettext python3-devel \
            python3-setuptools python3-wheel pyproject-rpm-macros
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v5

      - name: Build the RPM
        run: |
          mkdir -p dist rpmbuild/SOURCES
          version=1.0.0
          git archive --format=tar.gz --prefix="terminal-svg-demo-$version/" \
            --output="rpmbuild/SOURCES/terminal-svg-demo-$version.tar.gz" HEAD
          rpmbuild -bb packaging/rpm/terminal-svg-demo.spec \
            --define "_topdir $PWD/rpmbuild"
          cp rpmbuild/RPMS/noarch/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools
        run: |
          brew install gettext bats shellcheck
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Build the catalogues
        run: tools/build-locales.sh

      - name: Install the project
        run: python3 -m pip install -e .

      - name: Test
        run: |
          python3 -m unittest discover -s tests -v
          bats tests/shell

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y python3 gettext
          run: |
            export PATH=/usr/local/bin:$PATH
            tools/build-locales.sh
            PYTHONPATH=src python3 -m unittest discover -s tests -v
